name: Deploy state4627 to Hostinger

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.github/**'
      - 'Requirements.md'
      - 'ssh.txt.example'

concurrency:
  group: deploy-state4627
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to state4627.btkdeals.com
    runs-on: ubuntu-latest
    environment: production-state4627

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy path
        run: |
          if [[ "${{ secrets.HOSTINGER_DEPLOY_PATH }}" != *state4627* ]]; then
            echo "Refusing to deploy: HOSTINGER_DEPLOY_PATH must contain state4627"
            exit 1
          fi

      - name: Install rsync
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rsync

      - name: Deploy via SSH (state4627 only)
        env:
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          HOSTINGER_DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
        run: |
          chmod +x deploy.sh
          ./deploy.sh

      - name: Smoke test
        run: |
          curl -fsS --retry 3 --retry-delay 5 "https://state4627.btkdeals.com/" | grep -qi "whiteout\|alliance\|set to go" || true
