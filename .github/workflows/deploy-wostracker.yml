name: Deploy wostracker.online to Hostinger

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deploy-wostracker
  cancel-in-progress: true

env:
  HOSTINGER_SSH_HOST: 157.173.209.199
  HOSTINGER_SSH_USER: u229715236
  HOSTINGER_SSH_PORT: 65002
  HOSTINGER_DEPLOY_PATH: domains/wostracker.online/public_html

jobs:
  deploy:
    name: Deploy to wostracker.online
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy path
        run: |
          if [[ "${HOSTINGER_DEPLOY_PATH}" != *wostracker.online* ]]; then
            echo "Refusing to deploy: path must contain wostracker.online"
            exit 1
          fi

      - name: Install rsync and openssh-client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rsync openssh-client

      - name: Configure SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets.HOSTINGER_SSH_KEY_PASSPHRASE }}
        run: |
          if [[ -z "${SSH_PRIVATE_KEY}" ]]; then
            echo "Missing secret HOSTINGER_SSH_PRIVATE_KEY"
            echo "Add it at: https://github.com/pakabbas/WOSStats/settings/secrets/actions"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          if ! grep -q 'BEGIN OPENSSH PRIVATE KEY' ~/.ssh/deploy_key; then
            echo "Invalid HOSTINGER_SSH_PRIVATE_KEY: include BEGIN/END lines and line breaks"
            exit 1
          fi
          chmod 600 ~/.ssh/deploy_key
          eval "$(ssh-agent -s)"
          if ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "Using unencrypted deploy key"
            ssh-add ~/.ssh/deploy_key
          elif [[ -z "${SSH_PASSPHRASE}" ]]; then
            echo "This SSH key is encrypted. Add GitHub secret HOSTINGER_SSH_KEY_PASSPHRASE"
            echo "Or replace HOSTINGER_SSH_PRIVATE_KEY with an unencrypted key (hostinger_btkdeals_ed25519)"
            exit 1
          else
            export DISPLAY=:1
            export SSH_ASKPASS="${GITHUB_WORKSPACE}/.github/scripts/ssh-askpass.sh"
            export SSH_ASKPASS_REQUIRE=force
            chmod +x "$SSH_ASKPASS"
            ssh-add ~/.ssh/deploy_key </dev/null || {
              echo "ssh-add failed: wrong HOSTINGER_SSH_KEY_PASSPHRASE?"
              exit 1
            }
          fi
          ssh-add -l
          # Persist agent for later steps
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Ensure remote directory exists
        run: |
          ssh -o StrictHostKeyChecking=accept-new -p "$HOSTINGER_SSH_PORT" \
            "${HOSTINGER_SSH_USER}@${HOSTINGER_SSH_HOST}" \
            "mkdir -p '${HOSTINGER_DEPLOY_PATH}/data' '${HOSTINGER_DEPLOY_PATH}/uploads'"

      - name: Rsync application (preserve server-only files; no --delete)
        run: |
          # Intentionally NO --delete so server-only runtime files survive.
          # Also exclude secrets / runtime / VCS so we never overwrite them.
          rsync -avz \
            -e "ssh -p ${HOSTINGER_SSH_PORT} -o StrictHostKeyChecking=accept-new" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'config.json' \
            --exclude 'error_log' \
            --exclude 'ssh.txt' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'data/*.json' \
            --exclude 'data/*.log' \
            --exclude 'data/*.lock' \
            --exclude 'data/*.tmp' \
            --exclude 'data/atlas-cookies.txt' \
            --exclude 'data/rosters/' \
            --exclude 'data/roster-imports/' \
            --exclude 'data/roster-powers/' \
            --exclude 'data/atlas-v2/' \
            --exclude 'data/svs-*' \
            --exclude 'data/site-visits.json' \
            --exclude 'uploads/video/*' \
            --exclude 'uploads/chat/*' \
            --exclude 'uploads/incidents/*' \
            --exclude 'uploads/cache/' \
            --exclude 'Requirements.md' \
            --exclude 'deploy.sh' \
            --exclude 'scripts/' \
            --exclude 'ssh.txt.example' \
            --include 'uploads/video/.htaccess' \
            --include 'uploads/chat/.htaccess' \
            --include 'uploads/incidents/.htaccess' \
            --include 'data/.htaccess' \
            ./ "${HOSTINGER_SSH_USER}@${HOSTINGER_SSH_HOST}:${HOSTINGER_DEPLOY_PATH}/"

      - name: Post-deploy permissions (no config rewrite)
        run: |
          ssh -p "$HOSTINGER_SSH_PORT" -o StrictHostKeyChecking=accept-new \
            "${HOSTINGER_SSH_USER}@${HOSTINGER_SSH_HOST}" \
            "cd '${HOSTINGER_DEPLOY_PATH}' && \
             mkdir -p data uploads/video uploads/chat uploads/incidents && \
             chmod 755 data uploads && \
             if [ ! -f config.json ]; then \
               echo 'WARNING: config.json missing on server — create it before relying on NAP/admin features'; \
             fi"

      - name: Smoke test
        run: |
          set -e
          code_home=$(curl -sS -o /tmp/wost-home.html -w '%{http_code}' --retry 5 --retry-delay 5 "https://wostracker.online/")
          code_players=$(curl -sS -o /tmp/wost-players.html -w '%{http_code}' --retry 5 --retry-delay 5 "https://wostracker.online/players.php")
          echo "GET / -> ${code_home}"
          echo "GET /players.php -> ${code_players}"
          test "${code_home}" = "200"
          test "${code_players}" = "200"
          grep -qi 'whiteout\|alliance\|player\|wos' /tmp/wost-home.html
